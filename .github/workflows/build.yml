name: Build Dylib

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Theos
        uses: subosito/flutter-action@v2 # Və ya Theos quraşdırma addımları
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          # SDK quraşdırmaları...

      - name: Build Tweak
        run: |
          make clean
          make

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v3
        with:
          name: M7MD-Dylib
          path: .theos/obj/arm64/M7MD.dylib
