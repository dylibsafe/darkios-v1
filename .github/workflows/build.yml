name: Build Tweak Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Theos and Tools
      run: |
        export THEOS=$HOME/theos
        if [ ! -d "$THEOS" ]; then
          git clone --recursive https://github.com/theos/theos.git $THEOS
        fi
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        # Ldid-i yükləyirik
        curl -L -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
        sudo chmod +x /usr/local/bin/ldid

    - name: Download iOS SDK
      run: |
        if [ ! -d "$THEOS/sdks" ]; then
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
        fi

    - name: Compile Tweak
      run: |
        make clean || true
        make package FINALPACKAGE=1

    - name: Upload Deb and Dylib
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Output
        path: |
          packages/*.deb
          .theos/obj/arm64/*.dylib
          .theos/obj/debug/arm64/*.dylib
